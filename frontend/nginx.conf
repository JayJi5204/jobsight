server{
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
    }

    # 대응 절차·유형 카드·매뉴얼 원문·질문.
    # 호스트를 변수에 담아 이름 풀이를 요청 때로 미룬다. 글자 그대로 적으면
    # ai 가 아직 없을 때 nginx 가 뜨지 못해 화면 전체가 내려간다.
    location ~ ^/ai/(.*)$ {
        resolver 127.0.0.11 valid=10s;
        set $ai http://ai:8099;
        proxy_pass $ai/$1$is_args$args;
    }

    location /go2rtc/ {
        proxy_pass http://go2rtc:1984/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location ~ ^/playback/(.*)$ {
        resolver 127.0.0.11 valid=10s;
        set $playback http://mediamtx:9996;
        proxy_pass $playback/$1$is_args$args;

        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}