services:
  jenkins:
    build: .
    container_name: jobsight-jenkins
    restart: unless-stopped
    ports: 
     - "8070:8080"
     - "50000:50000"
    group_add:
      - "112"
    environment:
      DEPLOY_DIR: ${DEPLOY_DIR}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DEPLOY_DIR}:${DEPLOY_DIR}

volumes:
  jenkins_home: