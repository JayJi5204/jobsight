spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]

  application:
    name: backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

jobsight:
  recording:
    datasource:
      url: jdbc:postgresql://${RECORDING_HOST:localhost}:5432/${RECORDING_NAME}
      username: ${RECORDING_USERNAME}
      password: ${RECORDING_PASSWORD}
    root: ${RECORDING_DIR}
    zone: Asia/Seoul
    retention: 7d
    min-free-ratio: 0.15

logging:
  level:
    root: info
    org.hibernate: warn
    com.zaxxer.hikari: warn
    com.jobsight: debug
