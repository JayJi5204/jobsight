spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]

  application:
    name: backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

jobsight:
  recording:
    zone: Asia/Seoul
    playback-url: http://mediamtx:9996

logging:
  level:
    root: info
    org.hibernate: warn
    com.zaxxer.hikari: warn
    com.jobsight: debug
