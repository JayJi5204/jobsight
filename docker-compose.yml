services:
  postgres:
    image: postgres:18-alpine
    container_name: jobsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql

  pgvector:
    image: pgvector/pgvector:pg18
    container_name: jobsight-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGVECTOR_NAME}
      POSTGRES_USER: ${PGVECTOR_USER}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD}
    volumes:
      - pgvector-data:/var/lib/postgresql
      - ./ai/sql:/docker-entrypoint-initdb.d:ro

  go2rtc:
    image: alexxit/go2rtc
    container_name: jobsight-go2rtc
    restart: unless-stopped
    environment:
      CAMERA_HOST: ${CAMERA_HOST}
      CAMERA_USER: ${CAMERA_USER}
      CAMERA_PASSWORD: ${CAMERA_PASSWORD}
      WEBRTC_HOST: ${WEBRTC_HOST}
    ports:
      - "8555:8555/tcp"
      - "8555:8555/udp"
    volumes:
      - ./infra/go2rtc:/config:ro

  backend:
    build: ./backend
    container_name: jobsight-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: jobsight-frontend
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - backend

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    container_name: jobsight-ai
    restart: unless-stopped
    runtime: nvidia
    environment:
      PGHOST: pgvector
      PGPORT: 5432
      PGDATABASE: ${PGVECTOR_NAME}
      PGUSER: ${PGVECTOR_USER}
      PGPASSWORD: ${PGVECTOR_PASSWORD}
      HF_HOME: /models
      VLLM_URL: http://vllm:8000
    volumes:
      - ./manual:/app/manual:ro
      - ai-models:/models
    depends_on:
      - pgvector

  vllm:
    image: ghcr.io/nvidia-ai-iot/vllm:latest-jetson-thor
    container_name: jobsight-vllm
    restart: unless-stopped
    runtime: nvidia
    ipc: host
    environment:
      HF_HOME: /models
      HUGGINGFACE_HUB_CACHE: /models/hub
      TRANSFORMERS_CACHE: /models/hub
    volumes:
      - vllm-models:/models
    command: >
      vllm serve kakaocorp/kanana-1.5-8b-instruct-2505
      --served-model-name kanana
      --host 0.0.0.0
      --port 8000
      --max-model-len 8192
      --max-num-seqs 8
      --gpu-memory-utilization 0.30
      --enforce-eager


volumes:
  postgres-data:
  pgvector-data:
  ai-models:
  vllm-models:
